<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>ad unit</title>
  <style>
    html, body {
      margin: 0;
      padding: 8px;
      min-height: 100%;
      background: #0a0f0d;
      color: #8fa398;
      font: 12px/1.3 ui-monospace, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #stage { width: 100%; display: flex; align-items: center; justify-content: center; }
    .wait { opacity: 0.7; }
  </style>
</head>
<body>
  <div id="stage"><span class="wait">loading…</span></div>
  <script>
    (function () {
      var BANNER_KEY = "d737196962ef25449dcb66c5655248f1";
      var NATIVE_ID = "aa9f63337d56fa208fd27e208e22774a";
      var REWARD_SRC =
        "https://pl30566396.effectivecpmnetwork.com/75/7d/b0/757db01b5a07eb68043c6fd140726fed.js";

      var q = new URLSearchParams(location.search);
      var kind = (q.get("kind") || "banner").toLowerCase();
      var w = Math.max(120, parseInt(q.get("w") || "300", 10) || 300);
      var h = Math.max(50, parseInt(q.get("h") || "250", 10) || 250);
      var stage = document.getElementById("stage");
      stage.innerHTML = "";

      function addScript(src, attrs) {
        var s = document.createElement("script");
        s.src = src + (src.indexOf("?") >= 0 ? "&" : "?") + "cb=" + Date.now() + Math.floor(Math.random() * 1e5);
        s.async = true;
        s.setAttribute("data-cfasync", "false");
        if (attrs) Object.keys(attrs).forEach(function (k) { s.setAttribute(k, attrs[k]); });
        document.body.appendChild(s);
        return s;
      }

      if (kind === "native") {
        var box = document.createElement("div");
        box.id = "container-" + NATIVE_ID;
        box.style.cssText = "min-height:" + h + "px;width:100%;max-width:100%";
        stage.appendChild(box);
        addScript("https://pl30566397.effectivecpmnetwork.com/" + NATIVE_ID + "/invoke.js");
        return;
      }

      // banner / reward / smartlink visual all use 300x250-style atOptions unit
      window.atOptions = {
        key: BANNER_KEY,
        format: "iframe",
        height: h,
        width: w,
        params: {},
      };
      var hold = document.createElement("div");
      hold.style.cssText = "width:" + w + "px;max-width:100%;min-height:" + h + "px;margin:0 auto";
      stage.appendChild(hold);
      // Script must sit next to where Adsterra injects
      var s = document.createElement("script");
      s.setAttribute("data-cfasync", "false");
      s.src =
        "https://www.highperformanceformat.com/" +
        BANNER_KEY +
        "/invoke.js?cb=" +
        Date.now() +
        Math.floor(Math.random() * 1e5);
      hold.appendChild(s);

      if (kind === "reward") {
        addScript(REWARD_SRC);
      }
    })();
  </script>
</body>
</html>
