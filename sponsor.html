<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Steady · Sponsor</title>
  <link rel="canonical" href="https://steady.less-phone.workers.dev/sponsor.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Steady" />
  <meta property="og:title" content="Sponsor — Steady" />
  <meta property="og:description" content="Support Steady." />
  <meta property="og:url" content="https://steady.less-phone.workers.dev/sponsor.html" />
  <meta property="og:image" content="https://steady.less-phone.workers.dev/assets/steady-share.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Sponsor — Steady" />
  <meta name="twitter:description" content="Support Steady." />
  <meta name="twitter:image" content="https://steady.less-phone.workers.dev/assets/steady-share.jpg" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="stylesheet" href="fonts.css?v=1" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      background: #0c1b15;
      color: #f4f8f5;
      font-family: Manrope, system-ui, sans-serif;
    }
    body { padding: 1rem 1rem 5rem; }
    .card {
      max-width: 22rem; margin: 0 auto;
      border: 1px solid rgba(244,248,245,0.12);
      border-radius: 1.15rem;
      padding: 1.2rem;
      background: rgba(255,255,255,0.045);
      text-align: center;
    }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-size: 1.35rem; margin: 0 0 0.4rem;
    }
    .lede { color: #a8b9b0; line-height: 1.45; margin: 0 0 1rem; font-size: 0.95rem; }
    #steady-ad-stage {
      min-height: 260px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.75rem;
      margin: 0.5rem 0 1rem;
    }
    #status { min-height: 1.2em; color: #8ee0b8; font-size: 0.9rem; }
    button {
      width: 100%; border: 0; border-radius: 999px;
      padding: 0.85rem 1rem; font-weight: 700; font-family: inherit;
      background: #3dcf8a; color: #042316; cursor: pointer;
    }
    #btn-skip { background: transparent; color: #a8b9b0; margin-top: 0.4rem; }
    .progress-track {
      height: 6px; border-radius: 999px; background: rgba(244,248,245,0.08);
      overflow: hidden; margin: 0 0 0.75rem;
    }
    .progress-track > span {
      display: block; height: 100%; width: 0%;
      background: linear-gradient(90deg, #2a9b6a, #3dcf8a);
      transition: width 0.3s ease;
    }
  </style>
  <script src="js/runtime-config.js"></script>
</head>
<body>
  <div class="card">
    <h1>Help Steady stay alive</h1>
    <p class="lede" id="lede">A short sponsor keeps Steady free. Then you earn League shop points.</p>
    <div class="progress-track"><span id="steady-watch-progress"></span></div>
    <p id="steady-watch-tick">Loading sponsor…</p>
    <div id="steady-ad-stage" data-steady-reward-slot></div>
    <div id="steady-reward-slot" hidden></div>
    <p id="status"></p>
    <button type="button" id="btn" hidden>Watch sponsor</button>
    <button type="button" id="steady-watch-done" hidden disabled>Continue</button>
    <button type="button" id="btn-skip">Cancel</button>
  </div>
  <script src="js/monetize.js?v=5"></script>
  <script>
    (function () {
      const status = document.getElementById("status");
      const skip = document.getElementById("btn-skip");
      const tick = document.getElementById("steady-watch-tick");
      const stage = document.getElementById("steady-ad-stage");
      const M = window.SteadyMonetizeWeb;
      const fromApp = !!(window.SteadyNative) || /(?:\?|&)app=1(?:&|$)/.test(location.search);

      function native(fn, arg) {
        try {
          if (window.SteadyNative && typeof window.SteadyNative[fn] === "function") {
            window.SteadyNative[fn](arg);
            return true;
          }
        } catch (_) {}
        return false;
      }
        });
      }

      function earned() {
        status.textContent = "Thanks — reward unlocked.";
        tick.textContent = "Done";
        if (!native("rewardEarned")) location.href = "steady://rewarded";
      }

      function failed(msg) {
        status.textContent = msg || "Sponsor unavailable.";
        status.style.color = "#e8a0a0";
        if (!native("rewardFailed", msg || "Sponsor unavailable")) {}
      }

      skip.addEventListener("click", function () {
        if (!native("rewardCancelled")) location.href = "steady://cancel";
      });

      async function run() {
        // Mount site banners into the visible stage so the user actually sees a sponsor.
        try {
          if (M && M.mountBanner) M.mountBanner(stage);
        } catch (_) {}
        try {
          const ok = await M.showRewarded({
            autoComplete: false,
            silent: false,
            statusEl: status,
            tickEl: tick,
            progressEl: document.getElementById("steady-watch-progress"),
          });
          if (ok) earned();
          else failed("No sponsor right now — try again in a minute.");
        } catch (e) {
          failed(String(e && e.message ? e.message : e));
        }
      }

      if (!M || !M.isAppConfigured()) {
        status.textContent = "Sponsors aren’t available yet.";
        status.style.color = "#e8a0a0";
        return;
      }
      setTimeout(run, 200);
    })();
  </script>
</body>
</html>
