<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Steady</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
    #stage { width: 300px; height: 250px; margin: 0 auto; overflow: hidden; background: #fff; }
  </style>
</head>
<body>
  <div id="stage">
    <script>
      atOptions = {
        key: "d737196962ef25449dcb66c5655248f1",
        format: "iframe",
        height: 250,
        width: 300,
        params: {}
      };
    </script>
    <script src="https://www.highperformanceformat.com/d737196962ef25449dcb66c5655248f1/invoke.js"></script>
  </div>
  <script>
    (function () {
      var slot = new URLSearchParams(location.search).get("slot") || "";
      var tries = 0;
      var t = setInterval(function () {
        tries++;
        var filled =
          document.querySelectorAll("iframe").length > 0 ||
          document.querySelectorAll("img").length > 0;
        if (filled) {
          try {
            parent.postMessage({ type: "steady-unit-filled", slot: slot }, "*");
          } catch (_) {}
          clearInterval(t);
        } else if (tries > 40) {
          try {
            parent.postMessage({ type: "steady-unit-empty", slot: slot }, "*");
          } catch (_) {}
          clearInterval(t);
        }
      }, 250);
    })();
  </script>
</body>
</html>
