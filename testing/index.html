<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow" />
  <title>lab</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0f0d;
      --panel: #121a16;
      --line: rgba(244, 248, 245, 0.14);
      --text: #e8f0eb;
      --muted: #8fa398;
      --accent: #3dcf8a;
      --danger: #e8a0a0;
      --warn: #e6c36a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body.ads-only .lab-chrome { display: none !important; }
    .lab-chrome {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(10, 15, 13, 0.96);
      border-bottom: 1px solid var(--line);
      padding: 0.7rem 1rem 0.85rem;
      backdrop-filter: blur(10px);
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 0.75rem;
      align-items: center;
      margin: 0.3rem 0;
    }
    label.chk {
      display: inline-flex;
      gap: 0.3rem;
      align-items: center;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    label.chk input { accent-color: var(--accent); }
    input[type="number"] {
      width: 3.6rem;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.3rem 0.4rem;
      font: inherit;
    }
    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 6px;
      padding: 0.35rem 0.65rem;
      font: inherit;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      color: #042316;
      border-color: transparent;
      font-weight: 700;
    }
    #meta, #status, #tick, #fills { color: var(--muted); }
    #meta strong, #tick strong, #fills strong { color: var(--text); font-weight: 600; }
    #status.ok { color: var(--accent); }
    #status.err { color: var(--danger); }
    .note {
      color: var(--muted);
      font-size: 11px;
      max-width: 64rem;
      margin: 0.25rem 0 0;
    }
    #grid {
      display: grid;
      gap: 1rem;
      padding: 1rem;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      align-items: start;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      padding: 0.55rem;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 300px;
      position: relative;
    }
    .card.is-wide { grid-column: span 2; min-height: 160px; }
    .card.is-tall { min-height: 620px; }
    @media (max-width: 900px) {
      .card.is-wide { grid-column: span 1; }
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.45rem;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .card-head b { color: var(--text); font-weight: 600; }
    .card-head .st { color: var(--warn); }
    .card-head .st.ok { color: var(--accent); }
    .card-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #070b09;
      border-radius: 8px;
      min-height: 250px;
      position: relative;
    }
    .card-body > iframe.adframe {
      width: 100%;
      height: 100%;
      min-height: 250px;
      border: 0;
      background: #070b09;
      display: block;
    }
    .card.is-wide .card-body,
    .card.is-wide .card-body > iframe.adframe { min-height: 100px; }
    .card.is-tall .card-body,
    .card.is-tall .card-body > iframe.adframe { min-height: 600px; }
    .hit {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: block;
      text-indent: -9999px;
      overflow: hidden;
    }
    .pop-arm {
      width: 100%;
      min-height: 250px;
      border: 0;
      border-radius: 8px;
      background: linear-gradient(160deg, #1b2a22, #0f1713);
      color: var(--accent);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .pop-arm small { display: block; margin-top: 0.4rem; color: var(--muted); font-weight: 500; }
  </style>
</head>
<body>
  <div class="lab-chrome">
    <div class="row">
      <span id="meta">…</span>
      <span id="tick">next reload <strong>—</strong></span>
      <span id="fills">filled <strong>0</strong>/<strong>0</strong></span>
      <span id="status"></span>
    </div>
    <div class="row">
      <label>cards <input id="count" type="number" min="1" max="36" value="18" /></label>
      <label>reload <input id="secs" type="number" min="10" max="300" value="25" /> s</label>
      <label>retry empty <input id="retry" type="number" min="3" max="60" value="6" /> s</label>
      <label class="chk"><input type="checkbox" id="t-banner" checked /> banners</label>
      <label class="chk"><input type="checkbox" id="t-native" checked /> native</label>
      <label class="chk"><input type="checkbox" id="t-reward" checked /> reward</label>
      <label class="chk"><input type="checkbox" id="t-smartlink" checked /> smartlink</label>
      <label class="chk"><input type="checkbox" id="t-popunder" checked /> popunder</label>
      <label class="chk"><input type="checkbox" id="auto" checked /> auto reload</label>
      <label class="chk"><input type="checkbox" id="ads-only" /> ads only</label>
      <button type="button" class="primary" id="btn-refresh">reload all</button>
      <button type="button" id="btn-retry">retry empties</button>
    </div>
    <p class="note">
      Empty slots auto-retry. Smartlink cards show a real banner (Adsterra smartlinks are click URLs, not creatives) with the smartlink as the click layer.
      Popunder is armed in the page — tap the popunder card once to fire it.
    </p>
  </div>
  <div id="grid" aria-live="polite"></div>

  <script>
    (function () {
      var BANNER_KEY = "d737196962ef25449dcb66c5655248f1";
      var NATIVE_ID = "aa9f63337d56fa208fd27e208e22774a";
      var REWARD_SRC =
        "https://pl30566396.effectivecpmnetwork.com/75/7d/b0/757db01b5a07eb68043c6fd140726fed.js";
      var SMARTLINK =
        "https://www.effectivecpmnetwork.com/s889n4i77?key=38aa37c91a94f34912a4a89f8b27799d";
      var POPUNDER_SRC =
        "https://pl30567774.effectivecpmnetwork.com/3c/91/ea/3c91ea5fe0936ca26b9cc5cebf036f9f.js";

      // Bias hard toward sizes that actually fill for this key.
      var BANNER_SIZES = [
        { w: 300, h: 250, label: "300×250", cls: "" },
        { w: 300, h: 250, label: "300×250", cls: "" },
        { w: 300, h: 250, label: "300×250", cls: "" },
        { w: 336, h: 280, label: "336×280", cls: "" },
        { w: 300, h: 250, label: "300×250", cls: "" },
        { w: 728, h: 90, label: "728×90", cls: "is-wide" },
        { w: 300, h: 250, label: "300×250", cls: "" },
        { w: 320, h: 50, label: "320×50", cls: "is-wide" },
        { w: 160, h: 600, label: "160×600", cls: "is-tall" },
        { w: 300, h: 250, label: "300×250", cls: "" },
      ];

      var grid = document.getElementById("grid");
      var statusEl = document.getElementById("status");
      var meta = document.getElementById("meta");
      var tickEl = document.getElementById("tick");
      var fillsEl = document.getElementById("fills");
      var popunderLoaded = false;
      var reloadTimer = null;
      var countdownTimer = null;
      var retryTimer = null;
      var fillTimer = null;
      var nextAt = 0;
      var gen = 0;
      var slots = [];

      function setStatus(msg, kind) {
        statusEl.textContent = msg || "";
        statusEl.className = kind || "";
      }

      function num(id, min, max, fallback) {
        var n = parseInt(document.getElementById(id).value, 10);
        if (!isFinite(n)) n = fallback;
        if (n < min) n = min;
        if (n > max) n = max;
        document.getElementById(id).value = String(n);
        return n;
      }

      function adPage(inner, minH) {
        return (
          "<!DOCTYPE html><html><head><meta charset='utf-8'>" +
          "<style>html,body{margin:0;padding:6px;background:#070b09;min-height:" +
          (minH || 250) +
          "px;display:flex;align-items:center;justify-content:center}" +
          "iframe{margin:0 auto!important}</style></head><body>" +
          inner +
          "</body></html>"
        );
      }

      function bannerHtml(w, h) {
        var cb = Date.now() + "" + Math.floor(Math.random() * 1e6);
        return adPage(
          "<script>atOptions={key:'" +
            BANNER_KEY +
            "',format:'iframe',height:" +
            h +
            ",width:" +
            w +
            ",params:{}};<\/script>" +
            "<script src='https://www.highperformanceformat.com/" +
            BANNER_KEY +
            "/invoke.js?cb=" +
            cb +
            "'><\/script>",
          h
        );
      }

      function nativeHtml() {
        var cb = Date.now() + "" + Math.floor(Math.random() * 1e6);
        return adPage(
          "<div id='container-" +
            NATIVE_ID +
            "' style='min-height:250px;width:100%'></div>" +
            "<script async data-cfasync='false' src='https://pl30566397.effectivecpmnetwork.com/" +
            NATIVE_ID +
            "/invoke.js?cb=" +
            cb +
            "'><\/script>",
          280
        );
      }

      function rewardHtml() {
        var cb = Date.now() + "" + Math.floor(Math.random() * 1e6);
        return adPage(
          "<script>atOptions={key:'" +
            BANNER_KEY +
            "',format:'iframe',height:250,width:300,params:{}};<\/script>" +
            "<script src='https://www.highperformanceformat.com/" +
            BANNER_KEY +
            "/invoke.js?cb=" +
            cb +
            "'><\/script>" +
            "<script src='" +
            REWARD_SRC +
            "?cb=" +
            cb +
            "'><\/script>",
          260
        );
      }

      function ensurePopunder(on) {
        var existing = document.getElementById("steady-lab-popunder");
        if (!on) {
          if (existing) existing.remove();
          popunderLoaded = false;
          return;
        }
        if (popunderLoaded && existing) return;
        if (existing) existing.remove();
        var s = document.createElement("script");
        s.id = "steady-lab-popunder";
        s.async = true;
        s.setAttribute("data-cfasync", "false");
        s.src = POPUNDER_SRC + "?cb=" + Date.now();
        document.head.appendChild(s);
        popunderLoaded = true;
      }

      function setSlotStatus(slot, text, ok) {
        if (!slot || !slot.st) return;
        slot.st.textContent = text;
        slot.st.className = "st" + (ok ? " ok" : "");
      }

      function frameHasFill(frame) {
        try {
          var doc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
          if (!doc) return false;
          if (doc.querySelectorAll("iframe").length > 0) return true;
          if (doc.querySelectorAll("img").length > 0) return true;
          if (doc.querySelectorAll("ins,a[href]").length > 0) return true;
          var text = (doc.body && doc.body.innerText) || "";
          if (text && text.replace(/\s+/g, "").length > 8) return true;
          // Some units inject into body as children beyond our scripts
          var kids = doc.body ? doc.body.children.length : 0;
          return kids > 2;
        } catch (_) {
          // Cross-origin after fill often means the creative navigated — treat as filled
          return true;
        }
      }

      function remountSlot(slot) {
        if (!slot || slot.kind === "popunder") return;
        slot.attempts = (slot.attempts || 0) + 1;
        setSlotStatus(slot, "retry #" + slot.attempts, false);
        slot.filled = false;
        slot.body.innerHTML = "";

        if (slot.kind === "smartlink") {
          // Real creative + invisible smartlink hit area
          var frame = document.createElement("iframe");
          frame.className = "adframe";
          frame.title = "ad";
          frame.srcdoc = bannerHtml(300, 250);
          slot.body.appendChild(frame);
          slot.frame = frame;
          var hit = document.createElement("a");
          hit.className = "hit";
          hit.href = SMARTLINK;
          hit.target = "_blank";
          hit.rel = "noopener noreferrer sponsored";
          hit.textContent = "offer";
          slot.body.appendChild(hit);
          return;
        }

        var frame2 = document.createElement("iframe");
        frame2.className = "adframe";
        frame2.title = "ad";
        if (slot.kind === "banner") frame2.srcdoc = bannerHtml(slot.w, slot.h);
        else if (slot.kind === "native") frame2.srcdoc = nativeHtml();
        else frame2.srcdoc = rewardHtml();
        slot.body.appendChild(frame2);
        slot.frame = frame2;
      }

      function paintFills() {
        var total = 0;
        var filled = 0;
        slots.forEach(function (s) {
          if (s.kind === "popunder") return;
          total++;
          if (s.filled) filled++;
        });
        fillsEl.innerHTML = "filled <strong>" + filled + "</strong>/<strong>" + total + "</strong>";
      }

      function checkFills() {
        slots.forEach(function (s) {
          if (s.kind === "popunder") return;
          if (s.filled) return;
          if (!s.frame) return;
          if (frameHasFill(s.frame)) {
            s.filled = true;
            setSlotStatus(s, "filled", true);
          }
        });
        paintFills();
      }

      function retryEmpties() {
        var n = 0;
        slots.forEach(function (s) {
          if (s.kind === "popunder") return;
          if (s.filled) return;
          remountSlot(s);
          n++;
        });
        if (n) setStatus("retrying " + n + " empty slot(s)", "ok");
        paintFills();
      }

      function buildPlan(n) {
        var plan = [];
        var wantBanner = document.getElementById("t-banner").checked;
        var wantNative = document.getElementById("t-native").checked;
        var wantReward = document.getElementById("t-reward").checked;
        var wantSmart = document.getElementById("t-smartlink").checked;
        var types = [];
        if (wantBanner) types.push("banner");
        if (wantNative) types.push("native");
        if (wantReward) types.push("reward");
        if (wantSmart) types.push("smartlink");
        if (!types.length) return plan;

        var bi = 0;
        var i = 0;
        while (plan.length < n && i < n * 8) {
          var t = types[i % types.length];
          i++;
          if (t === "banner") {
            var sz = BANNER_SIZES[bi % BANNER_SIZES.length];
            bi++;
            plan.push({
              kind: "banner",
              detail: sz.label,
              w: sz.w,
              h: sz.h,
              cls: sz.cls,
            });
          } else if (t === "native") {
            plan.push({ kind: "native", detail: "native", w: 300, h: 280, cls: "" });
          } else if (t === "reward") {
            // Reward social bar is invisible; always pair with a visible 300x250
            plan.push({ kind: "reward", detail: "300×250+social", w: 300, h: 250, cls: "" });
          } else if (t === "smartlink") {
            plan.push({ kind: "smartlink", detail: "banner+click", w: 300, h: 250, cls: "" });
          }
        }
        while (plan.length < n) {
          var sz2 = BANNER_SIZES[bi % BANNER_SIZES.length];
          bi++;
          plan.push({
            kind: wantBanner ? "banner" : wantSmart ? "smartlink" : "banner",
            detail: sz2.label,
            w: sz2.w,
            h: sz2.h,
            cls: sz2.cls,
          });
        }
        return plan.slice(0, n);
      }

      function clearTimers() {
        if (countdownTimer) clearInterval(countdownTimer);
        if (reloadTimer) clearTimeout(reloadTimer);
        if (retryTimer) clearInterval(retryTimer);
        if (fillTimer) clearInterval(fillTimer);
        countdownTimer = reloadTimer = retryTimer = fillTimer = null;
      }

      function scheduleLoops() {
        clearTimers();
        fillTimer = setInterval(checkFills, 1000);
        var retrySecs = num("retry", 3, 60, 6);
        retryTimer = setInterval(retryEmpties, retrySecs * 1000);

        if (!document.getElementById("auto").checked) {
          tickEl.innerHTML = "auto <strong>off</strong>";
          return;
        }
        var secs = num("secs", 10, 300, 25);
        nextAt = Date.now() + secs * 1000;
        function paintTick() {
          var left = Math.max(0, Math.ceil((nextAt - Date.now()) / 1000));
          tickEl.innerHTML = "next reload <strong>" + left + "s</strong>";
        }
        paintTick();
        countdownTimer = setInterval(paintTick, 250);
        reloadTimer = setTimeout(function () {
          popunderLoaded = false;
          var old = document.getElementById("steady-lab-popunder");
          if (old) old.remove();
          render();
        }, secs * 1000);
      }

      function render() {
        var my = ++gen;
        var n = num("count", 1, 36, 18);
        var wantPop = document.getElementById("t-popunder").checked;
        var plan = buildPlan(n);
        slots = [];
        grid.innerHTML = "";
        ensurePopunder(wantPop);

        if (!plan.length && !wantPop) {
          setStatus("pick at least one ad type", "err");
          paintFills();
          return;
        }

        plan.forEach(function (item, idx) {
          var card = document.createElement("article");
          card.className = "card " + (item.cls || "");
          var head = document.createElement("div");
          head.className = "card-head";
          var left = document.createElement("span");
          left.innerHTML = "<b>" + item.kind + "</b> #" + (idx + 1) + " · " + item.detail;
          var st = document.createElement("span");
          st.className = "st";
          st.textContent = "loading";
          head.appendChild(left);
          head.appendChild(st);
          var body = document.createElement("div");
          body.className = "card-body";
          card.appendChild(head);
          card.appendChild(body);
          grid.appendChild(card);

          var slot = {
            kind: item.kind,
            w: item.w,
            h: item.h,
            body: body,
            st: st,
            frame: null,
            filled: false,
            attempts: 0,
          };
          slots.push(slot);

          setTimeout(function () {
            if (my !== gen) return;
            remountSlot(slot);
          }, idx * 120);
        });

        if (wantPop) {
          var card = document.createElement("article");
          card.className = "card";
          var head = document.createElement("div");
          head.className = "card-head";
          head.innerHTML = "<span><b>popunder</b> · armed</span><span class='st ok'>ready</span>";
          var body = document.createElement("div");
          body.className = "card-body";
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "pop-arm";
          btn.innerHTML = "Tap to fire popunder<small>real click — Adsterra needs a gesture</small>";
          btn.addEventListener("click", function () {
            // Re-inject script then synthetic page click so popunder can attach to gesture
            popunderLoaded = false;
            ensurePopunder(true);
            setTimeout(function () {
              document.body.click();
              btn.innerHTML = "Popunder gestured<small>check for under-tab / blocked popup</small>";
            }, 400);
          });
          body.appendChild(btn);
          card.appendChild(head);
          card.appendChild(body);
          grid.appendChild(card);
          slots.push({ kind: "popunder", filled: true, body: body, st: null });
        }

        setStatus(plan.length + " slots mounting", "ok");
        paintFills();
        scheduleLoops();
      }

      function paintMeta() {
        meta.innerHTML =
          "<strong>" + location.host + "</strong> " + location.pathname + " · adsterra";
      }

      document.getElementById("btn-refresh").addEventListener("click", function () {
        popunderLoaded = false;
        var old = document.getElementById("steady-lab-popunder");
        if (old) old.remove();
        render();
      });
      document.getElementById("btn-retry").addEventListener("click", retryEmpties);
      document.getElementById("ads-only").addEventListener("change", function (e) {
        document.body.classList.toggle("ads-only", !!e.target.checked);
      });
      document.getElementById("auto").addEventListener("change", function () {
        if (document.getElementById("auto").checked) scheduleLoops();
        else {
          clearTimers();
          tickEl.innerHTML = "auto <strong>off</strong>";
          fillTimer = setInterval(checkFills, 1000);
          retryTimer = setInterval(retryEmpties, num("retry", 3, 60, 6) * 1000);
        }
      });
      ["t-banner", "t-native", "t-reward", "t-smartlink", "t-popunder", "count", "secs", "retry"].forEach(
        function (id) {
          document.getElementById(id).addEventListener("change", function () {
            if (id === "secs" || id === "retry") {
              scheduleLoops();
              return;
            }
            popunderLoaded = false;
            var old = document.getElementById("steady-lab-popunder");
            if (old) old.remove();
            render();
          });
        }
      );

      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) retryEmpties();
      });

      paintMeta();
      render();
    })();
  </script>
</body>
</html>
