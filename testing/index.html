<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Steady ad lab</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0f0d;
      --panel: #121a16;
      --line: rgba(244, 248, 245, 0.13);
      --text: #e8f0eb;
      --muted: #8fa398;
      --accent: #3dcf8a;
      --warn: #e6c36a;
      --danger: #e8a0a0;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
    }
    body.ads-only .lab-chrome,
    body.ads-only #help { display: none !important; }
    .lab-chrome {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(10, 15, 13, 0.96);
      border-bottom: 1px solid var(--line);
      padding: 0.65rem 1rem 0.75rem;
      backdrop-filter: blur(12px);
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 0.65rem;
      align-items: center;
      margin: 0.22rem 0;
    }
    .title { font-weight: 800; color: var(--accent); letter-spacing: 0.04em; }
    label.chk {
      display: inline-flex;
      gap: 0.28rem;
      align-items: center;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      user-select: none;
    }
    label.chk input { accent-color: var(--accent); }
    input[type="number"] {
      width: 3.4rem;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.25rem 0.35rem;
      font: inherit;
    }
    button {
      border: 1px solid var(--line);
      background: #162019;
      color: var(--text);
      border-radius: 7px;
      padding: 0.35rem 0.65rem;
      font: inherit;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      color: #042316;
      border-color: transparent;
      font-weight: 800;
    }
    #meta, #status, #tick, #fills { color: var(--muted); font-size: 12px; }
    #meta strong, #tick strong, #fills strong { color: var(--text); }
    #status.ok { color: var(--accent); }
    #help {
      display: none;
      margin: 0.7rem 1rem 0;
      padding: 0.8rem 1rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      color: var(--muted);
      font-size: 12.5px;
      max-width: 48rem;
    }
    #help.show { display: block; }
    #help p { margin: 0.3rem 0; }
    #help strong { color: var(--text); }
    #grid {
      display: grid;
      gap: 0.9rem;
      padding: 0.9rem 1rem 1.2rem;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      align-items: start;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      min-height: 300px;
      overflow: hidden;
    }
    .card.is-pop { min-height: 170px; }
    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
    }
    .card-head b { color: var(--text); font-weight: 700; }
    .card-head .st { color: var(--warn); text-transform: none; letter-spacing: 0; }
    .card-head .st.ok { color: var(--accent); }
    .card-head .st.bad { color: var(--danger); }
    .card-body {
      flex: 1;
      min-height: 250px;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .adframe {
      width: 300px;
      height: 250px;
      max-width: 100%;
      border: 0;
      display: block;
      background: #fff;
    }
    .pop-arm {
      width: calc(100% - 8px);
      min-height: 140px;
      margin: 4px;
      border: 1px dashed rgba(61, 207, 138, 0.35);
      border-radius: 10px;
      background: rgba(61, 207, 138, 0.06);
      color: var(--text);
      text-align: left;
      padding: 0.85rem;
      font: inherit;
      cursor: pointer;
    }
    .pop-arm strong { color: var(--accent); display: block; margin-bottom: 0.3rem; }
    .pop-arm span { color: var(--muted); font-size: 12px; display: block; }
  </style>
  <script>
    // Force every /testing/ visit onto a fresh build URL so normal browsers
    // don't keep a stale cached lab (the ?chrome=1 window worked because it was uncached).
    (function () {
      var LAB_BUILD = "b8";
      var q = new URLSearchParams(location.search);
      if (q.get("v") === LAB_BUILD) return;
      q.set("v", LAB_BUILD);
      q.delete("chrome");
      location.replace(location.pathname + "?" + q.toString() + location.hash);
    })();
  </script>
</head>
<body>
  <div class="lab-chrome">
    <div class="row">
      <span class="title">AD LAB</span>
      <span id="meta">...</span>
      <span id="tick">reload <strong>-</strong></span>
      <span id="fills">ok <strong>0</strong>/<strong>0</strong></span>
      <span id="status"></span>
    </div>
    <div class="row">
      <label>cards <input id="count" type="number" min="4" max="16" value="8" /></label>
      <label>reload <input id="secs" type="number" min="5" max="120" value="12" /> s</label>
      <label>retry <input id="retry" type="number" min="2" max="60" value="4" /> s</label>
      <label class="chk"><input type="checkbox" id="t-popunder" checked /> popunder</label>
      <label class="chk"><input type="checkbox" id="auto" checked /> auto</label>
      <label class="chk"><input type="checkbox" id="ads-only" /> ads only</label>
      <button type="button" class="primary" id="btn-refresh">reload all</button>
      <button type="button" id="btn-retry">retry empties</button>
      <button type="button" id="btn-help">help</button>
    </div>
  </div>

  <section id="help">
    <p>Only path: <strong>/testing/</strong>. Opens a fresh build automatically. Two ads mount at a time; empties retry; grid reloads on the timer.</p>
  </section>

  <div id="grid" aria-live="polite"></div>

  <script>
    (function () {
      var LAB_BUILD = "b8";
      var BANNER_KEY = "d737196962ef25449dcb66c5655248f1";
      var POPUNDER_SRC =
        "https://pl30567774.effectivecpmnetwork.com/3c/91/ea/3c91ea5fe0936ca26b9cc5cebf036f9f.js";
      var CONCURRENCY = 2;

      var grid = document.getElementById("grid");
      var statusEl = document.getElementById("status");
      var meta = document.getElementById("meta");
      var tickEl = document.getElementById("tick");
      var fillsEl = document.getElementById("fills");
      var helpEl = document.getElementById("help");

      var popunderLoaded = false;
      var reloadTimer = null;
      var countdownTimer = null;
      var retryTimer = null;
      var nextAt = 0;
      var gen = 0;
      var slots = [];
      var activeMounts = 0;
      var waitQueue = [];

      function setStatus(msg, kind) {
        statusEl.textContent = msg || "";
        statusEl.className = kind || "";
      }

      function num(id, min, max, fallback) {
        var n = parseInt(document.getElementById(id).value, 10);
        if (!isFinite(n)) n = fallback;
        if (n < min) n = min;
        if (n > max) n = max;
        document.getElementById(id).value = String(n);
        return n;
      }

      function ensurePopunder(on) {
        var existing = document.getElementById("steady-lab-popunder");
        if (!on) {
          if (existing) existing.remove();
          popunderLoaded = false;
          return;
        }
        if (popunderLoaded && existing) return;
        if (existing) existing.remove();
        var s = document.createElement("script");
        s.id = "steady-lab-popunder";
        s.async = true;
        s.setAttribute("data-cfasync", "false");
        s.src = POPUNDER_SRC + "?cb=" + Date.now();
        document.head.appendChild(s);
        popunderLoaded = true;
      }

      function setSlotStatus(slot, text, ok, bad) {
        if (!slot || !slot.st) return;
        slot.st.textContent = text;
        slot.st.className = "st" + (ok ? " ok" : "") + (bad ? " bad" : "");
      }

      function paintFills() {
        var total = 0;
        var filled = 0;
        slots.forEach(function (s) {
          if (s.kind === "popunder") return;
          total++;
          if (s.filled) filled++;
        });
        fillsEl.innerHTML = "ok <strong>" + filled + "</strong>/<strong>" + total + "</strong>";
        if (filled === total && total > 0) setStatus("all slots filled", "ok");
      }

      function bannerSrcdoc(cb) {
        return (
          "<!DOCTYPE html><html><head><meta charset=\"utf-8\" />" +
          "<base href=\"" +
          location.origin +
          "/\" />" +
          "<style>html,body{margin:0;padding:0;background:#fff;overflow:hidden;width:300px;height:250px}" +
          "iframe,img{display:block;margin:0 auto;border:0;max-width:100%}</style></head><body>" +
          "<script>atOptions={key:'" +
          BANNER_KEY +
          "',format:'iframe',height:250,width:300,params:{}};<" +
          "/script>" +
          "<script src=\"https://www.highperformanceformat.com/" +
          BANNER_KEY +
          "/invoke.js?cb=" +
          encodeURIComponent(cb) +
          "\"><" +
          "/script>" +
          "</body></html>"
        );
      }

      function findCreative(doc) {
        if (!doc) return null;
        var imgs = doc.querySelectorAll("img");
        for (var i = 0; i < imgs.length; i++) {
          var img = imgs[i];
          if (img.complete && img.naturalWidth >= 40 && img.naturalHeight >= 40) {
            return { kind: "img", el: img };
          }
        }
        var frames = doc.querySelectorAll("iframe");
        for (var j = 0; j < frames.length; j++) {
          var f = frames[j];
          var src = f.src || "";
          if (!src || src === "about:blank") continue;
          if (f.offsetWidth >= 40 && f.offsetHeight >= 40) {
            return { kind: "iframe", el: f, src: src };
          }
        }
        return null;
      }

      function pumpQueue() {
        while (activeMounts < CONCURRENCY && waitQueue.length) {
          var slot = waitQueue.shift();
          if (!slot || slot.gen !== gen || slot.filled || slot.mounting) continue;
          startMount(slot);
        }
      }

      function enqueueMount(slot) {
        if (!slot || slot.kind === "popunder" || slot.filled || slot.mounting) return;
        if (waitQueue.indexOf(slot) >= 0) return;
        waitQueue.push(slot);
        setSlotStatus(slot, "queued", false, false);
        pumpQueue();
      }

      function startMount(slot) {
        if (!slot || slot.gen !== gen) return;
        slot.mounting = true;
        slot.attempts = (slot.attempts || 0) + 1;
        slot.filled = false;
        slot.mountedAt = Date.now();
        activeMounts += 1;
        setSlotStatus(slot, "loading", false, false);
        paintFills();

        if (slot.watchIv) {
          clearInterval(slot.watchIv);
          slot.watchIv = null;
        }

        slot.body.innerHTML = "";
        var iframe = document.createElement("iframe");
        iframe.className = "adframe";
        iframe.width = 300;
        iframe.height = 250;
        iframe.setAttribute("scrolling", "no");
        iframe.setAttribute("frameborder", "0");
        iframe.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
        iframe.setAttribute("allow", "attribution-reporting");
        iframe.title = "banner " + (slot.index + 1);
        iframe.srcdoc = bannerSrcdoc(Date.now() + "-" + slot.index + "-" + slot.attempts);
        slot.body.appendChild(iframe);
        slot.iframe = iframe;

        var checks = 0;
        slot.watchIv = setInterval(function () {
          if (slot.gen !== gen) {
            clearInterval(slot.watchIv);
            slot.watchIv = null;
            slot.mounting = false;
            activeMounts = Math.max(0, activeMounts - 1);
            pumpQueue();
            return;
          }
          checks += 1;
          var creative = null;
          try {
            creative = findCreative(iframe.contentDocument);
          } catch (_) {}

          if (creative) {
            clearInterval(slot.watchIv);
            slot.watchIv = null;
            slot.filled = true;
            slot.mounting = false;
            activeMounts = Math.max(0, activeMounts - 1);
            setSlotStatus(slot, "filled", true, false);
            paintFills();
            // brief pause then pull next from queue
            setTimeout(pumpQueue, 350);
            return;
          }

          // ~5.5s wait for inventory
          if (checks >= 18) {
            clearInterval(slot.watchIv);
            slot.watchIv = null;
            slot.mounting = false;
            activeMounts = Math.max(0, activeMounts - 1);
            setSlotStatus(slot, "empty", false, true);
            paintFills();
            pumpQueue();
          }
        }, 300);
      }

      function remountSlot(slot, force) {
        if (!slot || slot.kind === "popunder") return;
        if (!force && slot.mountedAt && Date.now() - slot.mountedAt < 2500) return;
        if (slot.mounting) return;
        enqueueMount(slot);
      }

      function retryEmpties() {
        var n = 0;
        slots.forEach(function (s) {
          if (s.kind === "popunder" || s.filled || s.mounting) return;
          if (s.mountedAt && Date.now() - s.mountedAt < 2500) return;
          enqueueMount(s);
          n += 1;
        });
        if (n) setStatus("retrying " + n, "ok");
      }

      function clearTimers() {
        if (countdownTimer) clearInterval(countdownTimer);
        if (reloadTimer) clearTimeout(reloadTimer);
        if (retryTimer) clearInterval(retryTimer);
        countdownTimer = reloadTimer = retryTimer = null;
      }

      function scheduleLoops() {
        clearTimers();
        retryTimer = setInterval(retryEmpties, num("retry", 2, 60, 4) * 1000);
        if (!document.getElementById("auto").checked) {
          tickEl.innerHTML = "auto <strong>off</strong>";
          return;
        }
        var secs = num("secs", 5, 120, 12);
        nextAt = Date.now() + secs * 1000;
        function paintTick() {
          var left = Math.max(0, Math.ceil((nextAt - Date.now()) / 1000));
          tickEl.innerHTML = "reload <strong>" + left + "s</strong>";
        }
        paintTick();
        countdownTimer = setInterval(paintTick, 250);
        reloadTimer = setTimeout(function () {
          popunderLoaded = false;
          var old = document.getElementById("steady-lab-popunder");
          if (old) old.remove();
          render();
        }, secs * 1000);
      }

      function render() {
        var my = ++gen;
        waitQueue = [];
        activeMounts = 0;
        var n = num("count", 4, 16, 8);
        var wantPop = document.getElementById("t-popunder").checked;
        slots.forEach(function (s) {
          if (s.watchIv) clearInterval(s.watchIv);
        });
        slots = [];
        grid.innerHTML = "";
        ensurePopunder(wantPop);

        for (var i = 0; i < n; i++) {
          (function (index) {
            var card = document.createElement("article");
            card.className = "card";
            var head = document.createElement("div");
            head.className = "card-head";
            var left = document.createElement("span");
            left.innerHTML = "<b>banner</b> #" + (index + 1) + " · 300x250";
            var st = document.createElement("span");
            st.className = "st";
            st.textContent = "queued";
            head.appendChild(left);
            head.appendChild(st);
            var body = document.createElement("div");
            body.className = "card-body";
            card.appendChild(head);
            card.appendChild(body);
            grid.appendChild(card);

            var slot = {
              kind: "banner",
              index: index,
              body: body,
              st: st,
              iframe: null,
              filled: false,
              attempts: 0,
              mountedAt: 0,
              gen: my,
              watchIv: null,
              mounting: false,
            };
            slots.push(slot);
            enqueueMount(slot);
          })(i);
        }

        if (wantPop) {
          var card = document.createElement("article");
          card.className = "card is-pop";
          var head = document.createElement("div");
          head.className = "card-head";
          head.innerHTML = "<span><b>popunder</b></span><span class=\"st ok\">armed</span>";
          var body = document.createElement("div");
          body.className = "card-body";
          body.style.background = "transparent";
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "pop-arm";
          btn.innerHTML =
            "<strong>Arm &amp; fire popunder</strong><span>Not an on-page ad. May open a tab behind this one (often blocked).</span>";
          btn.addEventListener("click", function () {
            popunderLoaded = false;
            ensurePopunder(true);
            setStatus("popunder re-armed", "ok");
          });
          body.appendChild(btn);
          card.appendChild(head);
          card.appendChild(body);
          grid.appendChild(card);
          slots.push({ kind: "popunder", filled: true });
        }

        paintFills();
        meta.innerHTML =
          "<strong>" +
          location.host +
          "</strong> /testing/ · <strong>" +
          n +
          "</strong> banners · build <strong>" +
          LAB_BUILD +
          "</strong>";
        scheduleLoops();
      }

      document.getElementById("btn-refresh").addEventListener("click", function () {
        popunderLoaded = false;
        var old = document.getElementById("steady-lab-popunder");
        if (old) old.remove();
        render();
      });
      document.getElementById("btn-retry").addEventListener("click", retryEmpties);
      document.getElementById("btn-help").addEventListener("click", function () {
        helpEl.classList.toggle("show");
      });
      document.getElementById("ads-only").addEventListener("change", function () {
        document.body.classList.toggle("ads-only", this.checked);
      });
      document.getElementById("auto").addEventListener("change", scheduleLoops);
      ["t-popunder", "count", "secs", "retry"].forEach(function (id) {
        document.getElementById(id).addEventListener("change", function () {
          if (id === "secs" || id === "retry") {
            scheduleLoops();
            return;
          }
          render();
        });
      });

      // Only boot after cache-bust redirect has settled on ?v=build
      if (new URLSearchParams(location.search).get("v") === LAB_BUILD) {
        render();
      }
    })();
  </script>
</body>
</html>
