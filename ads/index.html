<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Steady ad lab</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0f0d;
      --panel: #121a16;
      --line: rgba(244, 248, 245, 0.13);
      --text: #e8f0eb;
      --muted: #8fa398;
      --accent: #3dcf8a;
      --warn: #e6c36a;
      --danger: #e8a0a0;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
    }
    body.ads-only .lab-chrome,
    body.ads-only #help { display: none !important; }
    .lab-chrome {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(10, 15, 13, 0.96);
      border-bottom: 1px solid var(--line);
      padding: 0.7rem 1rem 0.85rem;
      backdrop-filter: blur(12px);
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem 0.7rem;
      align-items: center;
      margin: 0.25rem 0;
    }
    .title { font-weight: 800; color: var(--accent); letter-spacing: 0.04em; }
    label.chk {
      display: inline-flex;
      gap: 0.28rem;
      align-items: center;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      user-select: none;
    }
    label.chk input { accent-color: var(--accent); }
    input[type="number"] {
      width: 3.5rem;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.28rem 0.35rem;
      font: inherit;
    }
    button {
      border: 1px solid var(--line);
      background: #162019;
      color: var(--text);
      border-radius: 7px;
      padding: 0.38rem 0.7rem;
      font: inherit;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      color: #042316;
      border-color: transparent;
      font-weight: 800;
    }
    #meta, #status, #tick, #fills { color: var(--muted); font-size: 12px; }
    #meta strong, #tick strong, #fills strong { color: var(--text); }
    #status.ok { color: var(--accent); }
    #help {
      display: none;
      margin: 0.75rem 1rem 0;
      padding: 0.85rem 1rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      color: var(--muted);
      font-size: 12.5px;
      max-width: 52rem;
    }
    #help.show { display: block; }
    #help p { margin: 0.35rem 0; }
    #help strong { color: var(--text); }
    #grid {
      display: grid;
      gap: 1rem;
      padding: 1rem;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      align-items: start;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      padding: 0.55rem;
      display: flex;
      flex-direction: column;
      min-height: 310px;
      overflow: hidden;
    }
    .card.is-pop { min-height: 180px; }
    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.45rem;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
    }
    .card-head b { color: var(--text); font-weight: 700; }
    .card-head .st { color: var(--warn); text-transform: none; letter-spacing: 0; }
    .card-head .st.ok { color: var(--accent); }
    .card-head .st.bad { color: var(--danger); }
    .card-body {
      flex: 1;
      min-height: 260px;
      background: #ffffff;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .card-body .hold {
      width: 300px;
      height: 250px;
      max-width: 100%;
      overflow: hidden;
      background: #fff;
      position: relative;
    }
    .card-body .hold iframe {
      display: block !important;
      margin: 0 auto !important;
    }
    .pop-arm {
      width: calc(100% - 8px);
      min-height: 150px;
      margin: 4px;
      border: 1px dashed rgba(61, 207, 138, 0.35);
      border-radius: 10px;
      background: rgba(61, 207, 138, 0.06);
      color: var(--text);
      text-align: left;
      padding: 0.9rem;
      font: inherit;
      cursor: pointer;
    }
    .pop-arm strong { color: var(--accent); display: block; margin-bottom: 0.35rem; }
    .pop-arm span { color: var(--muted); font-size: 12px; display: block; }
  </style>
</head>
<body>
  <div class="lab-chrome">
    <div class="row">
      <span class="title">AD LAB</span>
      <span id="meta">...</span>
      <span id="tick">reload <strong>-</strong></span>
      <span id="fills">filled <strong>0</strong>/<strong>0</strong></span>
      <span id="status"></span>
    </div>
    <div class="row">
      <label>cards <input id="count" type="number" min="4" max="16" value="8" /></label>
      <label>reload <input id="secs" type="number" min="45" max="300" value="120" /> s</label>
      <label>retry <input id="retry" type="number" min="12" max="120" value="25" /> s</label>
      <label class="chk"><input type="checkbox" id="t-popunder" checked /> popunder</label>
      <label class="chk"><input type="checkbox" id="auto" checked /> auto</label>
      <label class="chk"><input type="checkbox" id="ads-only" /> ads only</label>
      <button type="button" class="primary" id="btn-refresh">reload all</button>
      <button type="button" id="btn-retry">retry empties</button>
      <button type="button" id="btn-help">help</button>
    </div>
  </div>

  <section id="help">
    <p>Each card is a real Adsterra <strong>300x250</strong> banner on a white stage (same style that showed MELBET before). Dead "refused to connect" offers are detected and reloaded.</p>
    <p>Open <strong>https://steady.less-phone.workers.dev/live/</strong> (hard refresh). Help stays hidden unless you tap Help.</p>
  </section>

  <div id="grid" aria-live="polite"></div>

  <script>
    (function () {
      var BANNER_KEY = "d737196962ef25449dcb66c5655248f1";
      var POPUNDER_SRC =
        "https://pl30567774.effectivecpmnetwork.com/3c/91/ea/3c91ea5fe0936ca26b9cc5cebf036f9f.js";

      var grid = document.getElementById("grid");
      var statusEl = document.getElementById("status");
      var meta = document.getElementById("meta");
      var tickEl = document.getElementById("tick");
      var fillsEl = document.getElementById("fills");
      var helpEl = document.getElementById("help");

      var popunderLoaded = false;
      var reloadTimer = null;
      var countdownTimer = null;
      var retryTimer = null;
      var nextAt = 0;
      var gen = 0;
      var slots = [];
      var mountQueue = Promise.resolve();

      function setStatus(msg, kind) {
        statusEl.textContent = msg || "";
        statusEl.className = kind || "";
      }

      function num(id, min, max, fallback) {
        var n = parseInt(document.getElementById(id).value, 10);
        if (!isFinite(n)) n = fallback;
        if (n < min) n = min;
        if (n > max) n = max;
        document.getElementById(id).value = String(n);
        return n;
      }

      function ensurePopunder(on) {
        var existing = document.getElementById("steady-lab-popunder");
        if (!on) {
          if (existing) existing.remove();
          popunderLoaded = false;
          return;
        }
        if (popunderLoaded && existing) return;
        if (existing) existing.remove();
        var s = document.createElement("script");
        s.id = "steady-lab-popunder";
        s.async = true;
        s.setAttribute("data-cfasync", "false");
        s.src = POPUNDER_SRC + "?cb=" + Date.now();
        document.head.appendChild(s);
        popunderLoaded = true;
      }

      function setSlotStatus(slot, text, ok, bad) {
        if (!slot || !slot.st) return;
        slot.st.textContent = text;
        slot.st.className = "st" + (ok ? " ok" : "") + (bad ? " bad" : "");
      }

      function paintFills() {
        var total = 0;
        var filled = 0;
        slots.forEach(function (s) {
          if (s.kind === "popunder") return;
          total++;
          if (s.filled) filled++;
        });
        fillsEl.innerHTML = "filled <strong>" + filled + "</strong>/<strong>" + total + "</strong>";
      }

      function looksDeadText(t) {
        t = (t || "").toLowerCase();
        return /refused to connect|err_connection|can't be reached|this site can.t be reached|not found|blocked|err_tunnel/.test(t);
      }

      function holdHealthy(hold) {
        if (!hold) return false;
        var iframes = hold.querySelectorAll("iframe");
        var imgs = hold.querySelectorAll("img");
        if (!iframes.length && !imgs.length) return false;
        for (var i = 0; i < iframes.length; i++) {
          var el = iframes[i];
          var r = el.getBoundingClientRect();
          if (r.width < 40 || r.height < 40) continue;
          try {
            var doc = el.contentDocument;
            if (doc) {
              var txt = (doc.body && doc.body.innerText) || "";
              if (looksDeadText(txt)) return false;
            }
          } catch (_) {
            // cross-origin creative - usually good
          }
          return true;
        }
        for (var j = 0; j < imgs.length; j++) {
          var ir = imgs[j].getBoundingClientRect();
          if (ir.width > 40 && ir.height > 40) return true;
        }
        return false;
      }

      function loadBannerScript(hold, slotId) {
        return new Promise(function (resolve) {
          window.atOptions = {
            key: BANNER_KEY,
            format: "iframe",
            height: 250,
            width: 300,
            params: { slot: slotId },
          };
          var s = document.createElement("script");
          s.setAttribute("data-cfasync", "false");
          s.src =
            "https://www.highperformanceformat.com/" +
            BANNER_KEY +
            "/invoke.js?cb=" +
            Date.now() +
            "s" +
            encodeURIComponent(slotId);
          s.onload = function () {
            resolve(true);
          };
          s.onerror = function () {
            resolve(false);
          };
          hold.appendChild(s);
        });
      }

      function remountSlot(slot, force) {
        if (!slot || slot.kind === "popunder") return;
        var now = Date.now();
        if (!force && slot.mountedAt && now - slot.mountedAt < 15000) return;
        if (slot.watchIv) clearInterval(slot.watchIv);

        slot.attempts = (slot.attempts || 0) + 1;
        slot.filled = false;
        slot.mountedAt = now;
        slot.gen = gen;
        slot.slotId = "b" + Date.now() + "r" + Math.floor(Math.random() * 1e6);
        setSlotStatus(slot, "loading", false, false);
        slot.body.innerHTML = "";

        var hold = document.createElement("div");
        hold.className = "hold";
        slot.body.appendChild(hold);
        slot.hold = hold;

        // Sequential queue so atOptions does not race between cards
        mountQueue = mountQueue.then(function () {
          if (slot.gen !== gen) return;
          return loadBannerScript(hold, slot.slotId).then(function (ok) {
            if (!ok) {
              setSlotStatus(slot, "script fail", false, true);
              return;
            }
            var checks = 0;
            slot.watchIv = setInterval(function () {
              if (slot.gen !== gen) {
                clearInterval(slot.watchIv);
                return;
              }
              checks++;
              if (holdHealthy(hold)) {
                slot.filled = true;
                setSlotStatus(slot, "filled", true, false);
                paintFills();
                clearInterval(slot.watchIv);
                return;
              }
              // Detect refused-to-connect inside nested iframe when readable
              var dead = false;
              hold.querySelectorAll("iframe").forEach(function (el) {
                try {
                  var doc = el.contentDocument;
                  if (doc && looksDeadText((doc.body && doc.body.innerText) || "")) dead = true;
                } catch (_) {}
              });
              if (dead) {
                setSlotStatus(slot, "dead offer", false, true);
                clearInterval(slot.watchIv);
                setTimeout(function () {
                  if (slot.gen === gen) remountSlot(slot, true);
                }, 700);
                return;
              }
              if (checks >= 28) {
                setSlotStatus(slot, "no fill", false, true);
                clearInterval(slot.watchIv);
                setTimeout(function () {
                  if (slot.gen === gen && !slot.filled) remountSlot(slot, true);
                }, 1000);
              }
            }, 450);
          });
        }).then(function () {
          return new Promise(function (r) {
            setTimeout(r, 650);
          });
        });
      }

      function retryEmpties() {
        var n = 0;
        slots.forEach(function (s) {
          if (s.kind === "popunder" || s.filled) return;
          if (s.mountedAt && Date.now() - s.mountedAt < 15000) return;
          remountSlot(s, true);
          n++;
        });
        if (n) setStatus("retrying " + n, "ok");
        paintFills();
      }

      function clearTimers() {
        if (countdownTimer) clearInterval(countdownTimer);
        if (reloadTimer) clearTimeout(reloadTimer);
        if (retryTimer) clearInterval(retryTimer);
        countdownTimer = reloadTimer = retryTimer = null;
      }

      function scheduleLoops() {
        clearTimers();
        retryTimer = setInterval(retryEmpties, num("retry", 12, 120, 25) * 1000);
        if (!document.getElementById("auto").checked) {
          tickEl.innerHTML = "auto <strong>off</strong>";
          return;
        }
        var secs = num("secs", 45, 300, 120);
        nextAt = Date.now() + secs * 1000;
        function paintTick() {
          var left = Math.max(0, Math.ceil((nextAt - Date.now()) / 1000));
          tickEl.innerHTML = "reload <strong>" + left + "s</strong>";
        }
        paintTick();
        countdownTimer = setInterval(paintTick, 250);
        reloadTimer = setTimeout(function () {
          popunderLoaded = false;
          var old = document.getElementById("steady-lab-popunder");
          if (old) old.remove();
          render();
        }, secs * 1000);
      }

      function render() {
        var my = ++gen;
        var n = num("count", 4, 16, 8);
        var wantPop = document.getElementById("t-popunder").checked;
        slots.forEach(function (s) {
          if (s.watchIv) clearInterval(s.watchIv);
        });
        slots = [];
        grid.innerHTML = "";
        mountQueue = Promise.resolve();
        ensurePopunder(wantPop);

        for (var i = 0; i < n; i++) {
          var card = document.createElement("article");
          card.className = "card";
          var head = document.createElement("div");
          head.className = "card-head";
          var left = document.createElement("span");
          left.innerHTML = "<b>banner</b> #" + (i + 1) + " · 300x250";
          var st = document.createElement("span");
          st.className = "st";
          st.textContent = "queued";
          head.appendChild(left);
          head.appendChild(st);
          var body = document.createElement("div");
          body.className = "card-body";
          card.appendChild(head);
          card.appendChild(body);
          grid.appendChild(card);

          var slot = {
            kind: "banner",
            body: body,
            st: st,
            hold: null,
            filled: false,
            attempts: 0,
            mountedAt: 0,
            gen: my,
          };

          slots.push(slot);
          (function (s, delay) {
            setTimeout(function () {
              if (gen !== my) return;
              remountSlot(s, true);
            }, delay);
          })(slot, 200 + i * 700);
        }

        if (wantPop) {
          var card = document.createElement("article");
          card.className = "card is-pop";
          var head = document.createElement("div");
          head.className = "card-head";
          head.innerHTML = "<span><b>popunder</b></span><span class='st ok'>armed</span>";
          var body = document.createElement("div");
          body.className = "card-body";
          body.style.background = "transparent";
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "pop-arm";
          btn.innerHTML =
            "<strong>Arm &amp; fire popunder</strong>" +
            "<span>Not an on-page ad. May open a tab behind this one (often blocked).</span>";
          btn.addEventListener("click", function () {
            popunderLoaded = false;
            ensurePopunder(true);
            setTimeout(function () {
              document.body.click();
              btn.innerHTML =
                "<strong>Gesture sent</strong><span>Check other tabs / blocked-popup icon.</span>";
            }, 300);
          });
          body.appendChild(btn);
          card.appendChild(head);
          card.appendChild(body);
          grid.appendChild(card);
          slots.push({ kind: "popunder", filled: true, body: body, st: null });
        }

        setStatus(n + " banners · one-by-one load", "ok");
        paintFills();
        scheduleLoops();
      }

      function paintMeta() {
        meta.innerHTML = "<strong>" + location.host + "</strong> " + location.pathname;
      }

      document.getElementById("btn-refresh").addEventListener("click", function () {
        popunderLoaded = false;
        var old = document.getElementById("steady-lab-popunder");
        if (old) old.remove();
        render();
      });
      document.getElementById("btn-retry").addEventListener("click", retryEmpties);
      document.getElementById("btn-help").addEventListener("click", function () {
        helpEl.classList.toggle("show");
      });
      document.getElementById("ads-only").addEventListener("change", function (e) {
        document.body.classList.toggle("ads-only", !!e.target.checked);
      });
      document.getElementById("auto").addEventListener("change", scheduleLoops);
      ["t-popunder", "count", "secs", "retry"].forEach(function (id) {
        document.getElementById(id).addEventListener("change", function () {
          if (id === "secs" || id === "retry") {
            scheduleLoops();
            return;
          }
          popunderLoaded = false;
          var old = document.getElementById("steady-lab-popunder");
          if (old) old.remove();
          render();
        });
      });

      paintMeta();
      render();
    })();
  </script>
</body>
</html>
